name: Deploy to Koyeb
description: "Deploys to Koyeb Instance"
runs:
  using: "composite"
  steps:
    - name: Install and configure the Koyeb CLI
      uses: koyeb-community/koyeb-actions@v2
      with:
        api_token: ${{ env.KOYEB_API_TOKEN }}

    - name: Create application secrets
      uses: ./.github/actions/setup-secrets
      env:
        GOOGLE_GENAI_API_KEY: ${{ env.GOOGLE_GENAI_API_KEY }}
        FINNHUB_API_KEY: ${{ env.FINNHUB_API_KEY }}
        INFLUXDB_BUCKET: ${{ env.INFLUXDB_BUCKET }}
        INFLUXDB_ORG: ${{ env.INFLUXDB_ORG }}
        INFLUXDB_TOKEN: ${{ env.INFLUXDB_TOKEN }}
        INFLUXDB_URL: ${{ env.INFLUXDB_URL }}
        GHCR_PAT_TOKEN: ${{ env.GHCR_PAT_TOKEN }}
        SERP_API_KEY: ${{ env.SERP_API_KEY }}
        X_AI_API_KEY: ${{ env.X_AI_API_KEY }}
        GROQ_API_KEY: ${{ env.GROQ_API_KEY }}
        ALPACA_API_KEY: ${{ env.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ env.ALPACA_SECRET_KEY }}
        NEW_RELIC_LICENSE_KEY: ${{ env.NEW_RELIC_LICENSE_KEY }}
        UPSTASH_REDIS_URL: ${{ env.UPSTASH_REDIS_URL }}
        SUPABASE_URL: ${{ env.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        CRON_SECRET: ${{ env.CRON_SECRET }}
        VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
        VAPID_PRIVATE_KEY: ${{ env.VAPID_PRIVATE_KEY }}
        RESEND_API_KEY: ${{ env.RESEND_API_KEY }}
        ALERT_EMAIL_ENABLED: ${{ env.ALERT_EMAIL_ENABLED }}

    - name: Build and deploy the application to Koyeb
      uses: koyeb/action-git-deploy@v1
      with:
        app-name: fi-foresight
        service-name: fi-foresight-service
        service-env: UPSTASH_REDIS_URL=@UPSTASH_REDIS_URL,FINNHUB_API_KEY=@FINNHUB_API_KEY,GOOGLE_GENAI_API_KEY=@GOOGLE_GENAI_API_KEY,INFLUXDB_BUCKET=@INFLUXDB_BUCKET,INFLUXDB_ORG=@INFLUXDB_ORG,INFLUXDB_TOKEN=@INFLUXDB_TOKEN,INFLUXDB_URL=@INFLUXDB_URL,SERP_API_KEY=@SERP_API_KEY,X_AI_API_KEY=@X_AI_API_KEY,GROQ_API_KEY=@GROQ_API_KEY,ALPACA_API_KEY=@ALPACA_API_KEY,ALPACA_SECRET_KEY=@ALPACA_SECRET_KEY,NEW_RELIC_LICENSE_KEY=@NEW_RELIC_LICENSE_KEY,SUPABASE_URL=@SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY=@SUPABASE_SERVICE_ROLE_KEY,CRON_SECRET=@CRON_SECRET,VAPID_PUBLIC_KEY=@VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY=@VAPID_PRIVATE_KEY,RESEND_API_KEY=@RESEND_API_KEY,ALERT_EMAIL_ENABLED=@ALERT_EMAIL_ENABLED,NEW_RELIC_APP_NAME=fi-foresight,APP_ENV=live
        service-ports: "3000:http"
        service-routes: "/:3000"
        service-regions: fra
        service-instance-type: free
        docker: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        docker-private-registry-secret: ghcr