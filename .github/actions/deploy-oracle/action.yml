name: Deploy to Oracle
description: "Deploys to Oracle VM Instance"
runs:
  using: "composite"
  steps:
    - name: Update IP in DNS Entry
      shell: bash
      run: |
        curl "https://www.duckdns.org/update?domains=${{ env.DOMAIN }}&token=${{ env.DUCK_DNS_TOKEN }}&ip=${{ env.VM_IP_ADDRESS }}&verbose=true"

    - name: Copy Nginx config
      uses: appleboy/scp-action@v1
      with:
        host: ${{ env.VM_IP_ADDRESS }}
        username: ubuntu
        key: ${{ env.VM_SSH_PRIVATE_KEY }}
        source: nginx/
        target: /home/ubuntu/

    - name: Install New Relic Infrastructure Agent
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.VM_IP_ADDRESS }}
        username: ubuntu
        key: ${{ env.VM_SSH_PRIVATE_KEY }}
        script: |
          # Skip if already installed
          if systemctl is-active --quiet newrelic-infra; then
            echo "New Relic already running, skipping install"
          else
            echo "Installing New Relic"
            curl -Ls https://download.newrelic.com/install/newrelic-cli/scripts/install.sh | bash
            sudo NEW_RELIC_API_KEY=${{ env.LINUX_NEW_RELIC_LICENSE_KEY }} NEW_RELIC_ACCOUNT_ID=7918507 NEW_RELIC_REGION=EU /usr/local/bin/newrelic install -y --tag environment:${{ env.APP_ENV }}
          fi
          
          # ---- New Relic Nginx integration ----
          sudo apt-get install -y nri-nginx
          sudo cp /home/ubuntu/nginx/newrelic-nginx-log.yml /etc/newrelic-infra/logging.d/nginx-log.yml
          sudo cp /home/ubuntu/nginx/newrelic-nginx.yml /etc/newrelic-infra/integrations.d/nginx-config.yml
          
          # ---- New Relic display name ----
          echo "${{ env.NEW_RELIC_APP_NAME }}"
          if sudo grep -q '^display_name:' /etc/newrelic-infra.yml; then
            sudo sed -i "s/^display_name:.*$/display_name: ${{ env.NEW_RELIC_APP_NAME }}/" /etc/newrelic-infra.yml
          else
            echo "display_name: ${{ env.NEW_RELIC_APP_NAME }}" | sudo tee -a /etc/newrelic-infra.yml
          fi
          sudo systemctl restart newrelic-infra

    - name: SSH and Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.VM_IP_ADDRESS }}
        username: ubuntu
        key: ${{ env.VM_SSH_PRIVATE_KEY }}
        command_timeout: "30m"
        script: |
          # Lowercase the image name for compatibility
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=${{ env.IMAGE_TAG }}

          # Log in to GHCR
          echo "${{ env.GH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>&1

          # Stop and remove existing container (if any)
          docker stop fiforesight || true
          docker rm fiforesight || true

          # Pull and run the new container
          docker pull $IMAGE_LOWER:$IMAGE_TAG
          docker run -d \
            --name fiforesight \
            --restart always \
            -p 3000:3000 \
            -e GOOGLE_GENAI_API_KEY=${{ env.GOOGLE_GENAI_API_KEY }} \
            -e FINNHUB_API_KEY=${{ env.FINNHUB_API_KEY }} \
            -e INFLUXDB_BUCKET=${{ env.INFLUXDB_BUCKET }} \
            -e INFLUXDB_ORG=${{ env.INFLUXDB_ORG }} \
            -e INFLUXDB_TOKEN=${{ env.INFLUXDB_TOKEN }} \
            -e INFLUXDB_URL=${{ env.INFLUXDB_URL }} \
            -e SERP_API_KEY=${{ env.SERP_API_KEY }} \
            -e X_AI_API_KEY=${{ env.X_AI_API_KEY }} \
            -e GROQ_API_KEY=${{ env.GROQ_API_KEY }} \
            -e ALPACA_API_KEY=${{ env.ALPACA_API_KEY }} \
            -e ALPACA_SECRET_KEY=${{ env.ALPACA_SECRET_KEY }} \
            -e FMP_API_KEY=${{ env.FMP_API_KEY }} \
            -e APP_ENV=${{ env.APP_ENV }} \
            -e NEW_RELIC_LICENSE_KEY=${{ env.NEW_RELIC_LICENSE_KEY }} \
            -e NEW_RELIC_APP_NAME=${{ env.NEW_RELIC_APP_NAME }} \
            -e UPSTASH_REDIS_URL=${{ env.UPSTASH_REDIS_URL }} \
            $IMAGE_LOWER:$IMAGE_TAG

          # Clean up old images
          docker image prune -af

    - name: New Relic Application Deployment Marker
      uses: newrelic/deployment-marker-action@v2.3.0
      with:
        apiKey: ${{ env.GH_NEW_RELIC_API_KEY }}
        guid: ${{ env.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}
        version: ${{ env.IMAGE_TAG }}
        user: "${{ github.actor }}"
        region: EU
