name: Setup Koyeb Secrets
description: "Creates secrets in Koyeb"
runs:
  using: "composite"
  steps:
    - name: Create GHCR Registry Secret
      shell: bash
      run: |
        koyeb secrets create ghcr \
          --type registry-private \
          --registry-url ghcr.io \
          --registry-username ${{ github.actor }} \
          --value ${{ env.GHCR_PAT_TOKEN }} || \
        koyeb secrets update ghcr \
          --registry-url ghcr.io \
          --registry-username ${{ github.actor }} \
          --value ${{ env.GHCR_PAT_TOKEN }}

    - name: Create GOOGLE_GENAI_API_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: GOOGLE_GENAI_API_KEY
        secret-value: "${{ env.GOOGLE_GENAI_API_KEY }}"

    - name: Create FINNHUB_API_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: FINNHUB_API_KEY
        secret-value: "${{ env.FINNHUB_API_KEY }}"

    - name: Create INFLUXDB_BUCKET secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: INFLUXDB_BUCKET
        secret-value: "${{ env.INFLUXDB_BUCKET }}"

    - name: Create INFLUXDB_ORG secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: INFLUXDB_ORG
        secret-value: "${{ env.INFLUXDB_ORG }}"

    - name: Create INFLUXDB_TOKEN secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: INFLUXDB_TOKEN
        secret-value: "${{ env.INFLUXDB_TOKEN }}"

    - name: Create INFLUXDB_URL secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: INFLUXDB_URL
        secret-value: "${{ env.INFLUXDB_URL }}"

    - name: Create SERP_API_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: SERP_API_KEY
        secret-value: "${{ env.SERP_API_KEY }}"

    - name: Create X_AI_API_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: X_AI_API_KEY
        secret-value: "${{ env.X_AI_API_KEY }}"

    - name: Create GROQ_API_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: GROQ_API_KEY
        secret-value: "${{ env.GROQ_API_KEY }}"

    - name: Create ALPACA_API_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: ALPACA_API_KEY
        secret-value: "${{ env.ALPACA_API_KEY }}"

    - name: Create ALPACA_SECRET_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: ALPACA_SECRET_KEY
        secret-value: "${{ env.ALPACA_SECRET_KEY }}"

    - name: Create NEW_RELIC_LICENSE_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: NEW_RELIC_LICENSE_KEY
        secret-value: "${{ env.NEW_RELIC_LICENSE_KEY }}"

    - name: Create UPSTASH_REDIS_URL secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: UPSTASH_REDIS_URL
        secret-value: "${{ env.UPSTASH_REDIS_URL }}"

    - name: Create SUPABASE_URL secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: SUPABASE_URL
        secret-value: "${{ env.SUPABASE_URL }}"

    - name: Create SUPABASE_SERVICE_ROLE_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: SUPABASE_SERVICE_ROLE_KEY
        secret-value: "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"

    - name: Create CRON_SECRET secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: CRON_SECRET
        secret-value: "${{ env.CRON_SECRET }}"

    - name: Create VAPID_PUBLIC_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: VAPID_PUBLIC_KEY
        secret-value: "${{ env.VAPID_PUBLIC_KEY }}"

    - name: Create VAPID_PRIVATE_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: VAPID_PRIVATE_KEY
        secret-value: "${{ env.VAPID_PRIVATE_KEY }}"

    - name: Create RESEND_API_KEY secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: RESEND_API_KEY
        secret-value: "${{ env.RESEND_API_KEY }}"

    - name: Create ALERT_EMAIL_ENABLED secret
      uses: koyeb/action-git-deploy/secret@v1
      with:
        secret-name: ALERT_EMAIL_ENABLED
        secret-value: "${{ env.ALERT_EMAIL_ENABLED }}"
