name: Daily RL Training

# Runs every weekday after US market close (4pm ET = 8pm UTC + 90min buffer).
# Each /predict call writes a forecast_record and resolves past forecasts,
# building per-model accuracy data that calibrates ensemble weights over time.

on:
  schedule:
    - cron: "30 21 * * 1-5" # 9:30 PM UTC, Mon–Fri
  workflow_dispatch: # manual trigger for testing

concurrency:
  group: daily-train
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install httpx

      - name: Run daily training (20 tickers)
        run: python backend/scripts/daily_train.py --url "https://fiforesight.duckdns.org" --delay 8
        env:
          PYTHONUNBUFFERED: "1"
