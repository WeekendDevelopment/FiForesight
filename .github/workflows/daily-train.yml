name: Daily RL Training

# Runs every weekday after US market close (4pm ET = 8pm UTC + 90min buffer).
# Each /predict call writes a forecast_record and resolves past forecasts,
# building per-model accuracy data that calibrates ensemble weights over time.

on:
  schedule:
    - cron: "30 21 * * 1-5" # 9:30 PM UTC, Mon–Fri
  workflow_dispatch:
    inputs:
      target_url:
        description: "Base URL to train against"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-train
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install httpx

      - name: Run daily training (20 tickers)
        run: |
          URL="${{ inputs.target_url || vars.TRAIN_URL || 'https://fiforesight.duckdns.org' }}"
          python .github/scripts/daily_train.py --url "$URL" --delay 8
        env:
          PYTHONUNBUFFERED: "1"
