name: Build
on:
  pull_request:
    branches:
      - "**"
permissions:
  contents: read
  id-token: write
  packages: write
  pull-requests: write
env:
  IMAGE_NAME: ghcr.io/weekenddevelopment/fiforesight
  EMAIL: ${{ secrets.CERTBOT_EMAIL }}
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment:
      name: "terraform.plan"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Terraform run
        uses: ./.github/actions/terraform
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          WORKING_DIR: "terraform"
  terraform-preview:
    runs-on: ubuntu-latest
    environment:
      name: "preview.terraform.apply"
    outputs:
      vm_host: ${{ steps.tf_outputs.outputs.public_ip }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Terraform run
        uses: ./.github/actions/terraform
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          WORKING_DIR: "terraform-preview"

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: terraform-preview
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        working-directory: frontend
        shell: bash
        run: npm install --global pnpm

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Install Dependencies
        working-directory: frontend
        shell: bash
        run: pnpm install --lockfile

      - name: Run Linting
        working-directory: frontend
        shell: bash
        run: pnpm run lint

      - name: Run Build
        working-directory: frontend
        shell: bash
        run: pnpm run build
        env:
          NEXT_PUBLIC_APP_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Latest pip
        working-directory: backend
        shell: bash
        run: pip install --upgrade pip

      - name: Install Dependencies
        working-directory: backend
        shell: bash
        run: pip install -r requirements.txt

      - name: Install Ruff
        working-directory: backend
        shell: bash
        run: pip install ruff

      - name: Run Ruff Linter
        working-directory: backend
        shell: bash
        run: ruff check .
  build-image:
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - build-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Application
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          push: true
          load: true
          build-args: |
            NEXT_PUBLIC_APP_ENV=preview
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run container in background
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          docker run -d \
          --name fi-foresight-test \
          -p 3000:3000 \
          ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for container to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/ 2>/dev/null; then
              curl http://localhost:3000/api/health
              echo "Application is up!" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application failed to start in time"
          docker logs fi-foresight-test
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f fi-foresight-test
  deploy-nginx:
    needs:
      - terraform-preview
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup HTTPS
        if: github.actor != 'dependabot[bot]'
        uses: ./.github/actions/setup-https
        env:
          VM_IP_ADDRESS: ${{ needs.terraform-preview.outputs.vm_host }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          DOMAIN: "fiforesight-preview.duckdns.org"
          DUCK_DNS_TOKEN: ${{ secrets.DUCK_DNS_TOKEN }}
          EMAIL: ${{ env.EMAIL }}

  deploy-preview:
    needs:
      - build-image
      - terraform-preview
      - deploy-nginx
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: https://fiforesight-preview.duckdns.org
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Redis
        if: github.actor != 'dependabot[bot]'
        uses: ./.github/actions/setup-redis
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          WORKING_DIR: "terraform"

      - name: Deploy to Oracle
        if: github.actor != 'dependabot[bot]'
        uses: ./.github/actions/deploy-oracle
        env:
          VM_IP_ADDRESS: ${{ needs.terraform-preview.outputs.vm_host }}
          DOMAIN: "fiforesight-preview"
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          DUCK_DNS_TOKEN: ${{ secrets.DUCK_DNS_TOKEN }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          INFLUXDB_BUCKET: ${{ secrets.INFLUXDB_BUCKET }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          X_AI_API_KEY: ${{ secrets.X_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          UPSTASH_REDIS_URL: ${{ env.UPSTASH_REDIS_URL }}
          APP_ENV: "preview"
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          LINUX_NEW_RELIC_LICENSE_KEY: ${{ secrets.LINUX_NEW_RELIC_LICENSE_KEY }}
          GH_NEW_RELIC_API_KEY: ${{ secrets.GH_NEW_RELIC_API_KEY }}
          NEW_RELIC_DEPLOYMENT_ENTITY_GUID: ${{ secrets.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}
          NEW_RELIC_APP_NAME: "fi-foresight-preview"

      - name: Create Comment
        if: github.actor != 'dependabot[bot]'
        run: |
          gh pr comment $PR_NUM --body "Deployed to preview env 🚀. Preview URL: https://fiforesight-preview.duckdns.org"
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}