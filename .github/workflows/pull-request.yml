name: Build
on:
  pull_request:
    branches:
      - "**"
permissions:
  contents: read
  id-token: write
  packages: write
env:
  IMAGE_NAME: ghcr.io/weekenddevelopment/fiforesight
jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Run Build
        working-directory: frontend
        run: pnpm run build

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ruff Linter
        working-directory: backend
        run: |
          pip install ruff
          ruff check .

  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Application (Internal Only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke Test (Backend Health Check)
        run: |
          docker run -d --name fi-foresight-test -p 8000:8000 ${{ env.IMAGE_NAME }}:latest
          for i in {1..30}; do
            if curl -f http://localhost:8000/ 2>/dev/null; then
              echo "Backend is up!" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend failed to start"
          docker logs fi-foresight-test
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f fi-foresight-test
