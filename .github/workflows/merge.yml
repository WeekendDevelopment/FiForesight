name: Build and Deploy
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_NAME: ghcr.io/weekenddevelopment/fiforesight
  OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
  OCI_CLI_REGION: uk-london-1
  OKE_CLUSTER_ID: ${{ secrets.OKE_CLUSTER_ID }}
  REGISTRY: ghcr.io
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        id: tag
        shell: bash
        run: |
          # get latest commit SHA
          git fetch --tags
          COMMIT_SHA=$(git rev-parse HEAD)
          PREVIOUS_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          # generate tag
          TAG="$(node .github/scripts/generate-version $PREVIOUS_TAG patch)"
          echo "Tagging commit $COMMIT_SHA with $TAG"
          git tag $TAG $COMMIT_SHA
          git push origin $TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        shell: bash
        run: |
          gh release create ${{ steps.tag.outputs.tag }} \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Automated release for latest commit after merge"
  terraform:
    needs: create-release
    runs-on: ubuntu-latest
    environment:
      name: "terraform.apply"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Terraform run
        uses: ./.github/actions/terraform
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

  build-frontend:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Setup pnpm
        working-directory: frontend
        shell: bash
        run: npm install --global pnpm

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Install Dependencies
        working-directory: frontend
        shell: bash
        run: pnpm install --lockfile

      - name: Run Build
        working-directory: frontend
        shell: bash
        run: pnpm run build
  build-backend:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Latest pip
        working-directory: backend
        shell: bash
        run: pip install --upgrade pip

      - name: Install Dependencies
        working-directory: backend
        shell: bash
        run: pip install -r requirements.txt
  build-image:
    needs:
      - create-release
      - build-frontend
      - build-backend
      - terraform
    runs-on: ubuntu-latest
    environment:
      name: live
      url: https://fi-foresight-weekend-development-a6cff98f.koyeb.app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Application and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install and configure the Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: "${{ secrets.KOYEB_API_TOKEN }}"

      - name: Create application secrets
        uses: ./.github/actions/setup-secrets
        env:
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          INFLUXDB_BUCKET: ${{ secrets.INFLUXDB_BUCKET }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          GHCR_PAT_TOKEN: ${{ secrets.GHCR_PAT_TOKEN }}

      - name: Build and deploy the application to Koyeb
        uses: koyeb/action-git-deploy@v1
        with:
          app-name: fi-foresight
          service-name: fi-foresight-service
          service-env: FINNHUB_API_KEY=@FINNHUB_API_KEY,GOOGLE_GENAI_API_KEY=@GOOGLE_GENAI_API_KEY,INFLUXDB_BUCKET=@INFLUXDB_BUCKET,INFLUXDB_ORG=@INFLUXDB_ORG,INFLUXDB_TOKEN=@INFLUXDB_TOKEN,INFLUXDB_URL=@INFLUXDB_URL
          service-ports: "3000:http"
          service-routes: "/:3000"
          service-regions: fra
          service-instance-type: free
          docker: ${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.tag }}
          docker-private-registry-secret: ghcr

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            # Lowercase the image name for compatibility
            IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

            # Log in to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Stop and remove existing container (if any)
            docker stop fiforesight || true
            docker rm fiforesight || true

            # Pull and run the new container
            docker pull $IMAGE_LOWER:$IMAGE_TAG
            docker run -d \
              --name fiforesight \
              --restart always \
              -p 80:3000 \
              -e GOOGLE_GENAI_API_KEY=${{ secrets.GOOGLE_GENAI_API_KEY }} \
              -e FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }} \
              -e INFLUXDB_BUCKET=${{ secrets.INFLUXDB_BUCKET }} \
              -e INFLUXDB_ORG=${{ secrets.INFLUXDB_ORG }} \
              -e INFLUXDB_TOKEN=${{ secrets.INFLUXDB_TOKEN }} \
              -e INFLUXDB_URL=${{ secrets.INFLUXDB_URL }} \
              -e GHCR_PAT_TOKEN=${{ secrets.GHCR_PAT_TOKEN }} \
              $IMAGE_LOWER:$IMAGE_TAG

            # Clean up old images
            docker image prune -af
