name: Build and Deploy
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_NAME: ghcr.io/weekenddevelopment/fiforesight
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        id: tag
        shell: bash
        run: |
          git fetch --tags
          COMMIT_SHA=$(git rev-parse HEAD)
          PREVIOUS_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "v0.0.0")
          TAG="$(node .github/scripts/generate-version $PREVIOUS_TAG patch)"
          echo "Tagging commit $COMMIT_SHA with $TAG"
          git tag $TAG $COMMIT_SHA
          git push origin $TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        shell: bash
        run: |
          gh release create ${{ steps.tag.outputs.tag }} \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Automated release for latest commit after merge"

  build-frontend:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Run Build
        working-directory: frontend
        run: pnpm run build

  build-backend:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

  build-image:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Application and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Smoke Test (Backend Health Check)
        run: |
          docker run -d --name fi-foresight-test -p 8080:3000 -p 8081:8000 ${{ env.IMAGE_NAME }}:latest
          for i in {1..30}; do
            if curl -f http://localhost:8081/health 2>/dev/null; then
              echo "Backend is up!" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend failed to start"
          docker logs fi-foresight-test
          exit 1
