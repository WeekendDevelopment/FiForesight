name: Build and Deploy
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_NAME: ghcr.io/weekenddevelopment/fiforesight
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        id: tag
        shell: bash
        run: |
          # get latest commit SHA
          git fetch --tags
          COMMIT_SHA=$(git rev-parse HEAD)
          PREVIOUS_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          # generate tag
          TAG="$(node .github/scripts/generate-version $PREVIOUS_TAG patch)"
          echo "Tagging commit $COMMIT_SHA with $TAG"
          git tag $TAG $COMMIT_SHA
          git push origin $TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        shell: bash
        run: |
          gh release create ${{ steps.tag.outputs.tag }} \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Automated release for latest commit after merge"
  terraform:
    needs: create-release
    runs-on: ubuntu-latest
    outputs:
      vm_host: ${{ steps.tf_outputs.outputs.public_ip }}
    environment:
      name: "terraform.apply"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Terraform run
        uses: ./.github/actions/terraform
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          WORKING_DIR: "terraform"

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

  build-frontend:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Setup pnpm
        working-directory: frontend
        shell: bash
        run: npm install --global pnpm

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Install Dependencies
        working-directory: frontend
        shell: bash
        run: pnpm install --lockfile

      - name: Run Build
        working-directory: frontend
        shell: bash
        run: pnpm run build
        env:
          NEXT_PUBLIC_APP_ENV: live
  build-backend:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Latest pip
        working-directory: backend
        shell: bash
        run: pip install --upgrade pip

      - name: Install Dependencies
        working-directory: backend
        shell: bash
        run: pip install -r requirements.txt
  build-image:
    needs:
      - create-release
      - build-frontend
      - build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Application and push
        uses: docker/build-push-action@v5
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_ENV=live
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
  deploy-koyeb:
    needs:
      - create-release
      - build-frontend
      - build-backend
      - build-image
    runs-on: ubuntu-latest
    environment:
      name: live-koyeb
      url: https://fi-foresight-weekend-development-a6cff98f.koyeb.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to Koyeb
        uses: ./.github/actions/deploy-koyeb
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.create-release.outputs.tag }}
          GHCR_PAT_TOKEN: ${{ secrets.GHCR_PAT_TOKEN }}
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          INFLUXDB_BUCKET: ${{ secrets.INFLUXDB_BUCKET }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          X_AI_API_KEY: ${{ secrets.X_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

  deploy-oracle:
    needs:
      - create-release
      - build-frontend
      - build-backend
      - build-image
      - terraform
    runs-on: ubuntu-latest
    environment:
      name: live
      url: http://fiforesight.duckdns.org
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to Oracle
        uses: ./.github/actions/deploy-oracle
        env:
          VM_IP_ADDRESS: ${{ needs.terraform.outputs.vm_host }}
          DOMAIN: "fiforesight"
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.create-release.outputs.tag }}
          DUCK_DNS_TOKEN: ${{ secrets.DUCK_DNS_TOKEN }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          INFLUXDB_BUCKET: ${{ secrets.INFLUXDB_BUCKET }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          X_AI_API_KEY: ${{ secrets.X_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APP_ENV: "live"
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          LINUX_NEW_RELIC_LICENSE_KEY: ${{ secrets.LINUX_NEW_RELIC_LICENSE_KEY }}
          GH_NEW_RELIC_API_KEY: ${{ secrets.GH_NEW_RELIC_API_KEY }}
          NEW_RELIC_DEPLOYMENT_ENTITY_GUID: ${{ secrets.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}
          NEW_RELIC_APP_NAME: "fi-foresight"