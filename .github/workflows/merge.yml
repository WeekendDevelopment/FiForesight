name: Node build
on:
  push:
    branches:
      - "main"
    paths:
      - "frontend/**"
  workflow_dispatch:
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Setup pnpm
        working-directory: frontend
        shell: bash
        run: npm install --global pnpm

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Install Dependencies
        working-directory: frontend
        shell: bash
        run: pnpm install --lockfile

      - name: Run Build
        working-directory: frontend
        shell: bash
        run: pnpm run build

      - name: Configure Git
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: tag
        shell: bash
        run: |
          # get latest commit SHA
          git fetch --tags
          COMMIT_SHA=$(git rev-parse HEAD)
          PREVIOUS_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          # generate tag
          TAG="$(node .github/scripts/generate-version $PREVIOUS_TAG patch)"
          echo "Tagging commit $COMMIT_SHA with $TAG"
          git tag $TAG $COMMIT_SHA
          git push origin $TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          gh release create ${{ steps.tag.outputs.tag }} \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Automated release for latest commit after merge"