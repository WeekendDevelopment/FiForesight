name: Build and Deploy
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_NAME: ghcr.io/weekend-development/fi-foresight
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  create-release:
    uses: WeekendDevelopment/FiForesight/actions/create-release.yml@main
  build-frontend:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Setup pnpm
        working-directory: frontend
        shell: bash
        run: npm install --global pnpm

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Install Dependencies
        working-directory: frontend
        shell: bash
        run: pnpm install --lockfile

      - name: Run Build
        working-directory: frontend
        shell: bash
        run: pnpm run build
  build-backend:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Latest pip
        working-directory: backend
        shell: bash
        run: pip install --upgrade pip

      - name: Install Dependencies
        working-directory: backend
        shell: bash
        run: pip install -r requirements.txt
  build-image:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Application and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}