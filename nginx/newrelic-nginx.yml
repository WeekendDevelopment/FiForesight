integrations:
  - name: nri-nginx
    env:
      METRICS: "true"
      INVENTORY: "true"
      STATUS_URL: https://127.0.0.1/nginx_status
      STATUS_MODULE: discover
      VALIDATE_CERTS: false
      CONFIG_PATH: /etc/nginx/nginx.conf
      REMOTE_MONITORING: true
    interval: 30s
    labels:
      role: web_server
    inventory_source: config/nginx